  <title>Quiz Antincendio VVF — Idoneità Tecnica</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const QUIZ = {
      combustione: {
        label: "🔥 Combustione",
        color: "#e63946",
        questions: [
          { q: "Si definisce combustione:", opts: ["La trasformazione fisica di un materiale senza alterarne la natura chimica","Qualunque reazione chimica nella quale un combustibile reagisce con un comburente dando luogo a calore, fiamma, gas e fumo","Una reazione chimica endotermica che assorbe calore dall'ambiente","La fusione di un solido in un liquido per effetto del calore"], ans: 1, exps: ["❌ SBAGLIATO. Quella è una trasformazione fisica (es. scioglimento del ghiaccio). La combustione è invece una REAZIONE CHIMICA che modifica la natura chimica delle sostanze, producendo nuovi composti (CO₂, H₂O, CO, ecc.).","✅ CORRETTO! La combustione è una reazione chimica ESOTERMICA (produce calore) tra un combustibile (sostanza ossidabile) e un comburente (sostanza ossidante, di solito O₂ dell'aria), con sviluppo di calore, fiamma, luce, gas e fumo.","❌ SBAGLIATO. La combustione è una reazione ESOTERMICA (libera calore verso l'esterno), non endotermica. Le reazioni endotermiche assorbono calore — è l'opposto della combustione.","❌ SBAGLIATO. La fusione è un cambiamento di stato fisico (solido→liquido). La combustione è una reazione chimica che trasforma le sostanze in prodotti come CO₂, H₂O, CO, fumo."] },
          { q: "Affinché la reazione di combustione abbia inizio, deve sempre verificarsi:", opts: ["La sola presenza di una fonte di calore sufficiente","La contemporanea presenza del solo combustibile e del comburente","La contemporanea presenza di combustibile, comburente e innesco/sorgente di calore","La presenza di temperatura ambiente superiore a 100°C"], ans: 2, exps: ["❌ SBAGLIATO. Il calore da solo non basta: servono anche il combustibile e il comburente. Senza questi due elementi non può avvenire alcuna combustione.","❌ SBAGLIATO. Combustibile e comburente da soli formano solo DUE lati del triangolo del fuoco. Senza l'innesco (energia di attivazione), la miscela rimane inerte.","✅ CORRETTO! Il 'triangolo del fuoco' richiede TUTTI e TRE gli elementi contemporaneamente: COMBUSTIBILE + COMBURENTE + ENERGIA DI ATTIVAZIONE (innesco). Mancando anche solo uno, la combustione non avviene o si interrompe.","❌ SBAGLIATO. Non esiste una temperatura ambiente minima fissa. La benzina può innescarsi già a -20°C, l'olio lubrificante richiede temperature molto più alte."] },
          { q: "In caso di mancata presenza di uno degli elementi del 'triangolo del fuoco', la reazione di combustione:", opts: ["Rallenta notevolmente ma può continuare","Non ha luogo oppure si estingue","Può avvenire lo stesso con percentuali elevate di ossigeno in aria","Si trasforma in una reazione endotermica"], ans: 1, exps: ["❌ SBAGLIATO. La combustione non può 'rallentare' senza uno degli elementi: si interrompe completamente. Questo è il principio su cui si basa lo spegnimento degli incendi.","✅ CORRETTO! Se manca ANCHE SOLO UNO dei tre elementi (combustibile, comburente, innesco/calore), la reazione di combustione NON può avvenire o si estingue immediatamente. È su questo principio che si basano tutti i metodi di spegnimento.","❌ SBAGLIATO. Anche con percentuali elevate di ossigeno, senza combustibile o senza innesco non può avvenire combustione. Tutti e tre gli elementi devono essere presenti simultaneamente.","❌ SBAGLIATO. La combustione non si trasforma in un altro tipo di reazione. Semplicemente si interrompe o non avviene."] },
          { q: "Il combustibile è:", opts: ["L'ossigeno presente nell'aria che partecipa alla reazione di combustione","Qualunque sostanza che, ossidandosi, partecipa alla reazione chimica di combustione","Una sostanza che a contatto con altri materiali provoca una reazione endotermica","Solo le sostanze allo stato solido che possono prendere fuoco"], ans: 1, exps: ["❌ SBAGLIATO. L'ossigeno dell'aria è il COMBURENTE, non il combustibile. Il comburente è la sostanza ossidante che permette la reazione.","✅ CORRETTO! Il combustibile è qualsiasi sostanza OSSIDABILE che partecipa alla reazione di combustione. Può essere SOLIDO (legno, carta), LIQUIDO (benzina, alcool) o GASSOSO (metano, GPL). Si ossida durante la reazione liberando energia.","❌ SBAGLIATO. Una reazione endotermica assorbe calore — è l'opposto di ciò che avviene nella combustione, che è esotermica (libera calore).","❌ SBAGLIATO. I combustibili possono essere allo stato SOLIDO, LIQUIDO o GASSOSO. La benzina, il metano, il GPL sono tutti combustibili liquidi o gassosi."] },
          { q: "Per ottenere lo spegnimento dell'incendio si può ricorrere:", opts: ["Solo al raffreddamento con acqua","Solo all'esaurimento del combustibile o al soffocamento","All'esaurimento del combustibile, al soffocamento, al raffreddamento o all'inibizione chimica","Solo all'allontanamento delle persone dall'area dell'incendio"], ans: 2, exps: ["❌ SBAGLIATO. L'acqua non è sempre applicabile (es. metalli alcalini, impianti elettrici). Esistono altri metodi ugualmente efficaci.","❌ SBAGLIATO. Esistono altri due metodi: il raffreddamento (abbassare la T sotto quella di accensione) e l'inibizione chimica (anticatalisi con polveri o halon).","✅ CORRETTO! Esistono 4 metodi di spegnimento: 1) ESAURIMENTO DEL COMBUSTIBILE (allontanarlo dal focolaio), 2) SOFFOCAMENTO (ridurre/eliminare l'O₂), 3) RAFFREDDAMENTO (abbassare la T sotto quella di accensione), 4) INIBIZIONE CHIMICA/anticatalisi (interrompere la reazione a catena con polveri o halon).","❌ SBAGLIATO. Allontanare le persone è una misura di sicurezza, non un metodo di spegnimento dell'incendio."] },
          { q: "Gli incendi, in relazione allo stato fisico dei materiali combustibili, si distinguono in:", opts: ["Tre classi: A, B e C","Quattro classi: A, B, C e D","Cinque classi: A, B, C, D ed F","Sei classi: A, B, C, D, E ed F"], ans: 2, exps: ["❌ SBAGLIATO. Non esistono solo 3 classi. Mancano la classe D (metalli) e la classe F (oli da cucina).","❌ SBAGLIATO. Non esistono solo 4 classi. Manca la classe F (oli e grassi vegetali/animali da cottura, introdotta dalla norma UNI EN 2:2005).","✅ CORRETTO! Le classi di incendio sono 5 (norma UNI EN 2:2005): CLASSE A (solidi con braci), CLASSE B (liquidi infiammabili), CLASSE C (gas infiammabili), CLASSE D (metalli combustibili), CLASSE F (oli/grassi da cottura). La vecchia CLASSE E (impianti elettrici) non esiste più.","❌ SBAGLIATO. Non esiste la classe E nell'attuale classificazione. La vecchia classe E per gli incendi elettrici è stata eliminata perché questi incendi rientrano nelle classi A o B."] },
          { q: "Gli incendi di Classe A sono incendi di:", opts: ["Liquidi infiammabili e solidi che possono liquefare (benzina, nafta, vernici)","Gas infiammabili (metano, propano, GPL)","Materiali solidi con formazione di braci (carta, legno, tessuti)","Metalli combustibili (magnesio, sodio, potassio)"], ans: 2, exps: ["❌ SBAGLIATO. Quelli sono gli incendi di CLASSE B (liquidi infiammabili). Per la classe B l'estinguente ideale è la schiuma a bassa espansione.","❌ SBAGLIATO. Quelli sono gli incendi di CLASSE C (gas infiammabili). Per la classe C la prima azione è chiudere la valvola di intercettazione.","✅ CORRETTO! Classe A = materiali SOLIDI ORGANICI che bruciano formando BRACI: legno, carta, cartone, tessuti, pelle, gomma, plastiche comuni. L'estinguente migliore è l'ACQUA per la sua azione di raffreddamento e penetrazione nelle braci.","❌ SBAGLIATO. Quelli sono gli incendi di CLASSE D (metalli combustibili). Richiedono polveri speciali — gli estinguenti ordinari possono essere pericolosi."] },
          { q: "Gli incendi di Classe B sono incendi di:", opts: ["Materiali solidi con formazione di braci","Liquidi infiammabili e solidi che possono liquefare (benzina, petrolio, vernici, nafta)","Gas infiammabili","Oli e grassi da cucina"], ans: 1, exps: ["❌ SBAGLIATO. Quelli sono gli incendi di CLASSE A. La caratteristica distintiva della classe A è la formazione di braci durante la combustione.","✅ CORRETTO! Classe B = LIQUIDI INFIAMMABILI e solidi che si liquefanno: benzina (-20°C), gasolio (+65°C), alcool (+13°C), solventi, vernici, oli minerali, cere, nafta. L'estinguente ideale è la SCHIUMA che agisce per soffocamento superficiale.","❌ SBAGLIATO. Quelli sono gli incendi di CLASSE C. I gas infiammabili richiedono come prima azione l'intercettazione del flusso di gas.","❌ SBAGLIATO. Quelli sono gli incendi di CLASSE F, introdotta dalla norma UNI EN 2:2005 per gli oli e grassi vegetali/animali negli apparecchi da cucina."] },
          { q: "Gli incendi di Classe C sono incendi di:", opts: ["Metalli combustibili","Materiali solidi con formazione di braci","Gas infiammabili (metano, propano, GPL, idrogeno, acetilene)","Liquidi infiammabili"], ans: 2, exps: ["❌ SBAGLIATO. I metalli combustibili appartengono alla CLASSE D. Richiedono polveri speciali e personale particolarmente addestrato.","❌ SBAGLIATO. I materiali solidi con braci appartengono alla CLASSE A. L'acqua è l'estinguente principale per questa classe.","✅ CORRETTO! Classe C = GAS INFIAMMABILI: metano (LIE 5%-LSE 15%), GPL/butano+propano (LIE 2%-LSE 9%), idrogeno, acetilene, propano. ATTENZIONE: non spegnere mai un incendio di gas senza prima chiudere la valvola! Si rischierebbe un'esplosione della miscela gas-aria accumulata.","❌ SBAGLIATO. I liquidi infiammabili appartengono alla CLASSE B. L'estinguente ideale per la classe B è la schiuma."] },
          { q: "Gli incendi di Classe D sono incendi di:", opts: ["Materiali solidi organici con formazione di braci","Liquidi infiammabili","Gas infiammabili","Metalli combustibili (magnesio, potassio, sodio, alluminio, fosforo)"], ans: 3, exps: ["❌ SBAGLIATO. Quelli sono gli incendi di CLASSE A (legno, carta, tessuti). Per questi si usa l'acqua.","❌ SBAGLIATO. Quelli sono gli incendi di CLASSE B (benzina, solventi, oli). Per questi si usa la schiuma.","❌ SBAGLIATO. Quelli sono gli incendi di CLASSE C (metano, GPL, idrogeno). Per questi si intercetta il flusso di gas.","✅ CORRETTO! Classe D = METALLI COMBUSTIBILI: magnesio, sodio, potassio, fosforo, titanio, alluminio, carburi, nitrati. ATTENZIONE: usare SOLO polveri speciali per classe D! L'acqua reagisce violentemente con sodio e potassio liberando idrogeno esplosivo."] },
          { q: "Gli incendi di Classe F sono incendi di:", opts: ["Gas infiammabili ad alta pressione","Incendi che interessano oli e grassi vegetali o animali in apparecchi di cottura","Materiali solidi con formazione di fumi densi","Fluidi refrigeranti infiammabili"], ans: 1, exps: ["❌ SBAGLIATO. I gas ad alta pressione rientrano nella CLASSE C. La classe F è specifica per i mezzi di cottura.","✅ CORRETTO! Classe F = oli e grassi VEGETALI o ANIMALI negli APPARECCHI DA CUCINA (friggitrici, cucine industriali). Introdotta dalla norma UNI EN 2:2005. ATTENZIONE: l'acqua su oli caldi causa esplosione di vapore!","❌ SBAGLIATO. Non esiste una classe specifica per i materiali con fumi densi. I fumi abbondanti sono tipici degli incendi di classe A (plastica) e B.","❌ SBAGLIATO. I fluidi refrigeranti infiammabili rientrano nella classe B o C a seconda del loro stato fisico."] },
          { q: "La più bassa temperatura alla quale un liquido sviluppa vapori che in presenza di innesco si accendono è definita:", opts: ["Temperatura di ebollizione","Temperatura di accensione o autoaccensione","Temperatura di infiammabilità","Temperatura di combustione"], ans: 2, exps: ["❌ SBAGLIATO. La temperatura di ebollizione è quella alla quale il liquido passa allo stato di vapore. La benzina bolle intorno ai 40-80°C, ma è già infiammabile a -20°C.","❌ SBAGLIATO. La temperatura di accensione è quella alla cui il combustibile brucia SENZA bisogno di innesco esterno. È un concetto diverso dalla temperatura di infiammabilità.","✅ CORRETTO! La TEMPERATURA DI INFIAMMABILITÀ (Ti) è la minima T alla quale un liquido emette vapori sufficienti da formare una miscela infiammabile se innescata. Esempi: benzina -20°C, acetone -18°C, alcool etilico +13°C, gasolio +65°C. Ti più bassa = maggior pericolo!","❌ SBAGLIATO. La temperatura di combustione è la temperatura massima raggiunta durante la combustione. È un concetto diverso."] },
          { q: "Un liquido infiammabile, ai fini del rischio incendio:", opts: ["È più pericoloso se ha alte temperature di infiammabilità","La pericolosità non dipende dalla temperatura di infiammabilità","È più pericoloso se ha BASSE temperature di infiammabilità","È pericoloso solo se supera la sua temperatura di ebollizione"], ans: 2, exps: ["❌ SBAGLIATO. È vero il contrario. Alta temperatura di infiammabilità significa che il liquido è meno pericoloso in condizioni normali.","❌ SBAGLIATO. La temperatura di infiammabilità è il parametro principale per valutare il rischio di incendio di un liquido.","✅ CORRETTO! Un liquido con BASSA Ti è PIÙ PERICOLOSO perché emette vapori infiammabili già a temperature basse. La benzina (Ti=-20°C) è pericolosissima anche in inverno; il gasolio (Ti=+65°C) è molto meno pericoloso a temperatura ambiente.","❌ SBAGLIATO. Un liquido può essere pericoloso anche a temperature molto inferiori a quella di ebollizione."] },
          { q: "Con 'campo di infiammabilità' si intende:", opts: ["La temperatura di autoaccensione della sostanza","L'intervallo di concentrazione (% vol.) aria-combustibile tra LIE e LSE in cui si ha combustione","La quantità massima di gas stoccabile in sicurezza","La pressione massima di compressione del gas"], ans: 1, exps: ["❌ SBAGLIATO. La temperatura di autoaccensione è un parametro diverso: è la T alla quale il gas si accende spontaneamente senza innesco.","✅ CORRETTO! Il CAMPO DI INFIAMMABILITÀ è l'intervallo di concentrazione (% in volume) del combustibile nella miscela aria-combustibile tra LIE e LSE entro cui, se innescata, la miscela brucia. Esempio metano: campo 5%-15% (LIE=5% troppo povero, LSE=15% troppo ricco).","❌ SBAGLIATO. La quantità stoccabile è un parametro logistico, non ha nulla a che fare con i limiti di infiammabilità.","❌ SBAGLIATO. La pressione di stoccaggio è una caratteristica costruttiva delle bombole. Non riguarda la composizione della miscela aria-gas."] },
          { q: "La temperatura di accensione (autoaccensione) rappresenta:", opts: ["La T minima alla quale un liquido emette vapori infiammabili","La T massima raggiungibile in un incendio","La minima T alla quale una sostanza brucia SPONTANEAMENTE senza innesco esterno","La T alla quale si forma il flash-over"], ans: 2, exps: ["❌ SBAGLIATO. Quella è la temperatura di INFIAMMABILITÀ, valida solo per i liquidi. La T di accensione si applica a solidi, liquidi e gas.","❌ SBAGLIATO. La T massima in un incendio è la temperatura teorica di combustione (es. metano ~2050°C). È un parametro diverso.","✅ CORRETTO! La T di ACCENSIONE/AUTOACCENSIONE è la minima T alla cui il combustibile brucia SPONTANEAMENTE in presenza di aria, SENZA bisogno di fiamma o scintilla. Esempi: benzina 250°C, legno 220-250°C, metano 537°C, idrogeno 560°C. Più bassa = più pericoloso.","❌ SBAGLIATO. Il flash-over avviene a circa 500-600°C di temperatura media ambiente. Non corrisponde alla T di accensione di una singola sostanza."] },
          { q: "I meccanismi con cui una sorgente d'ignizione scambia calore con un combustibile sono:", opts: ["Solo irraggiamento e convezione","Solo conduzione tra superfici a contatto","Conduzione, convezione e irraggiamento","Solo convezione nei fluidi e irraggiamento nel vuoto"], ans: 2, exps: ["❌ SBAGLIATO. Manca la conduzione, che è fondamentale: ad esempio quando le fiamme toccano direttamente un materiale.","❌ SBAGLIATO. La conduzione è solo uno dei tre meccanismi. Convezione e irraggiamento sono altrettanto importanti.","✅ CORRETTO! I TRE meccanismi sono: CONDUZIONE (contatto diretto tra corpi), CONVEZIONE (trasporto di materia in fluidi — i gas caldi salgono portando calore, 'plume'), IRRAGGIAMENTO (onde elettromagnetiche — funziona anche nel vuoto). Tutti e tre concorrono alla propagazione degli incendi.","❌ SBAGLIATO. La convezione avviene nei fluidi (gas e liquidi) e la conduzione avviene anche tra solidi. L'irraggiamento non è limitato al vuoto."] },
          { q: "Si ha autocombustione quando:", opts: ["Un materiale si innesca a causa di una fiamma esterna diretta","Il calore viene prodotto dallo stesso combustibile senza sorgenti esterne di attivazione","Un materiale esplode per compressione adiabatica","Si verifica un cortocircuito in un impianto elettrico"], ans: 1, exps: ["❌ SBAGLIATO. L'innesco da fiamma esterna è accensione DIRETTA, non autocombustione.","✅ CORRETTO! L'AUTOCOMBUSTIONE avviene quando il calore è generato INTERNAMENTE al materiale (reazioni biochimiche, fermentazione, lenta ossidazione) senza sorgenti esterne. La T sale gradualmente fino all'accensione. Esempi: cumuli di carbone, fieno bagnato, stracci imbevuti di olio di lino.","❌ SBAGLIATO. La compressione adiabatica è un fenomeno fisico (usato nei motori diesel). Non è autocombustione.","❌ SBAGLIATO. Il cortocircuito è una sorgente elettrica di innesco ESTERNA. Non è autocombustione."] },
          { q: "I fumi sono formati da:", opts: ["Prodotti allo stato gassoso prima della reazione di combustione","Piccolissime particelle solide (aerosol) e liquide (nebbie/vapori condensati) disperse nei gas di combustione","Solo vapore acqueo che si condensa durante il raffreddamento","Solo gas tossici come CO e CO₂"], ans: 1, exps: ["❌ SBAGLIATO. I prodotti gassosi pre-combustione sono i vapori del combustibile. I fumi si formano DURANTE e DOPO la combustione.","✅ CORRETTO! I FUMI sono: PARTICELLE SOLIDE (aerosol = incombusti e ceneri prodotti in carenza di O₂ → fumo SCURO) e PARTICELLE LIQUIDE (nebbie/vapori condensati, essenzialmente vapore acqueo condensato sotto 100°C → fumo BIANCO). I fumi impediscono la visibilità e trascinano sostanze tossiche.","❌ SBAGLIATO. Il vapore acqueo condensato dà fumo BIANCO, ma i fumi contengono anche particelle solide incombusti che danno il caratteristico colore scuro.","❌ SBAGLIATO. CO e CO₂ sono gas di combustione (rimangono gassosi a T ambiente). I fumi sono le particelle solide e liquide sospese, fisicamente distinte dai gas."] },
          { q: "Il monossido di carbonio (CO) è pericoloso perché:", opts: ["Ha un colore rossastro che riduce la visibilità","Ha un odore pungente che provoca tosse immediata","Si combina con l'emoglobina con affinità 220x superiore all'ossigeno, impedendo il trasporto di O₂ alle cellule","Esplode facilmente quando si accumula negli ambienti"], ans: 2, exps: ["❌ SBAGLIATO. Il CO è INCOLORE: non è visibile e non riduce la visibilità. Questa caratteristica lo rende ancora più pericoloso.","❌ SBAGLIATO. Il CO è INODORE e NON IRRITANTE: non si avverte né con l'olfatto né con le vie respiratorie. Le vittime spesso perdono conoscenza senza alcun preavviso.","✅ CORRETTO! Il CO si combina con l'EMOGLOBINA con affinità 220 VOLTE superiore all'ossigeno, formando CARBOSSIEMOGLOBINA. Blocca il trasporto di O₂ causando anossia. A 500 ppm: 4 min max; a 1000 ppm: 2 min; a 10.000 ppm: morte in 1 min. INVISIBILE e INSAPORE: non ti accorgi del pericolo!","❌ SBAGLIATO. Il CO può formare miscele esplosive con l'aria, ma la sua pericolosità principale negli incendi è la TOSSICITÀ per il sangue, non l'esplosività."] },
          { q: "L'anidride carbonica (CO₂) negli incendi è pericolosa perché:", opts: ["È un gas tossico per il sangue come il monossido di carbonio","È un gas asfissiante che si sostituisce all'ossigeno e stimola il ritmo respiratorio accelerando l'intossicazione","Ha un colore giallastro che maschera la visibilità","Si infiamma facilmente in presenza di calore"], ans: 1, exps: ["❌ SBAGLIATO. La CO₂ NON è tossica per il sangue come il CO. Non forma carbossiemoglobina. Il meccanismo è diverso: agisce per sostituzione dell'ossigeno.","✅ CORRETTO! La CO₂ è un gas ASFISSIANTE: si sostituisce all'O₂. Quando O₂ scende sotto il 17% → asfissia. Inoltre stimola il ritmo respiratorio (al 2% respiro +50%, al 3% raddoppia), accelerando così l'assunzione di altri gas tossici presenti nell'incendio.","❌ SBAGLIATO. La CO₂ è INCOLORE, non ha colore giallastro. È invisibile.","❌ SBAGLIATO. La CO₂ è usata come ESTINGUENTE perché è completamente NON infiammabile."] },
          { q: "Il flash-over è caratterizzato da:", opts: ["Un focolaio localizzato con temperature basse","La fase finale di raffreddamento","La transizione da incendio localizzato a generalizzato con T oltre 500°C e combustione di tutti i materiali presenti","L'innesco iniziale dell'incendio"], ans: 2, exps: ["❌ SBAGLIATO. Quella è la fase di IGNIZIONE (prima fase). Il flash-over avviene molto dopo.","❌ SBAGLIATO. Quella è la fase di ESTINZIONE/RAFFREDDAMENTO (quarta e ultima fase).","✅ CORRETTO! Il FLASH-OVER è il PUNTO DI NON RITORNO: quando T ambiente supera 500-600°C e l'irraggiamento dal soffitto raggiunge 15-20 kW/m², TUTTI i materiali combustibili si autoaccendono SIMULTANEAMENTE. Dopo il flash-over è impossibile intervenire con estintori portatili.","❌ SBAGLIATO. L'innesco iniziale è la fase di IGNIZIONE (prima fase). Il flash-over è la terza fase."] },
          { q: "I liquidi combustibili, in funzione della temperatura di infiammabilità, vengono raggruppati in:", opts: ["Cinque classi: A, B, C, D ed F","Due categorie: infiammabili e combustibili","Tre categorie: A (Ti<21°C), B (Ti 21-65°C), C (Ti 65-125°C)","Tre classi: bassa, media e alta pericolosità"], ans: 2, exps: ["❌ SBAGLIATO. Le classi A, B, C, D, F classificano i TIPI DI INCENDIO, non i liquidi combustibili.","❌ SBAGLIATO. La distinzione generica 'infiammabili/combustibili' non costituisce la classificazione ufficiale per la sicurezza antincendio.","✅ CORRETTO! I liquidi combustibili si classificano in TRE CATEGORIE: Categoria A (Ti < 21°C: benzina -20°C, acetone -18°C) — MASSIMO RISCHIO; Categoria B (Ti 21-65°C: kerosene +37°C); Categoria C (Ti 65-125°C: gasolio +65°C, oli combustibili).","❌ SBAGLIATO. La classificazione ufficiale non usa termini 'bassa/media/alta pericolosità' ma categorie A, B, C basate su precisi valori di temperatura di infiammabilità."] },
          { q: "Quale tra le seguenti sostanze ha il valore di calore specifico (J/kg×°C) più elevato?", opts: ["Benzina","Alluminio","Acqua","Ferro"], ans: 2, exps: ["❌ SBAGLIATO. La benzina ha calore specifico ~2240 J/kg×°C, molto inferiore a quello dell'acqua (4180 J/kg×°C).","❌ SBAGLIATO. L'alluminio ha calore specifico ~896 J/kg×°C, circa 5 volte inferiore all'acqua.","✅ CORRETTO! L'ACQUA ha il calore specifico più elevato tra le sostanze comuni: 4180 J/kg×°C. Per riscaldare 1 kg di acqua di 1°C servono 4180 Joule. È per questo che l'acqua è un eccellente estinguente per raffreddamento — assorbe enormi quantità di calore.","❌ SBAGLIATO. Il ferro ha calore specifico ~450 J/kg×°C, circa 9 volte inferiore all'acqua."] }
        ]
      },
      estinguenti: {
        label: "💧 Estinguenti e presidi",
        color: "#2196f3",
        questions: [
          { q: "Nello spegnimento di un incendio, l'acqua agisce per:", opts: ["Solo inibizione chimica della reazione","Raffreddamento e soffocamento","Solo soffocamento, escludendo il raffreddamento","Esaurimento del combustibile"], ans: 1, exps: ["❌ SBAGLIATO. L'inibizione chimica è un'azione specifica di polveri e halon, non dell'acqua.","✅ CORRETTO! L'acqua agisce per: RAFFREDDAMENTO (calore specifico 4180 J/kg°C; calore latente vaporizzazione 2260 kJ/kg) + SOFFOCAMENTO (evaporando si espande 1670 volte, diluendo l'O₂) + Diluizione sostanze idrosolubili + Imbibimento materiali solidi.","❌ SBAGLIATO. L'acqua agisce anche per raffreddamento, che è anzi la sua azione principale. L'evaporazione dell'acqua assorbe enormi quantità di calore.","❌ SBAGLIATO. L'acqua non rimuove il combustibile dal focolaio. Agisce principalmente raffreddando e creando vapore."] },
          { q: "L'acqua come agente estinguente è vietata in presenza di:", opts: ["Qualsiasi tipo di fuoco all'interno di edifici","Sostanze che reagiscono violentemente con essa (es. sodio, potassio) producendo gas esplosivi o tossici","Incendi di classe A perché danneggerebbe i materiali","Qualsiasi incendio all'aperto"], ans: 1, exps: ["❌ SBAGLIATO. L'acqua è usata comunemente negli edifici. Le limitazioni sono specifiche per alcune sostanze.","✅ CORRETTO! L'acqua è VIETATA con: SODIO e POTASSIO (producono IDROGENO esplosivo!), CARBURI (producono acetilene), ACIDI CONCENTRATI (reazione violenta). SCONSIGLIATA su impianti elettrici in tensione (conduttrice) e su apparecchiature delicate.","❌ SBAGLIATO. L'acqua è IDEALE per gli incendi di classe A (solidi organici). La penetrazione nelle braci e il raffreddamento la rendono l'estinguente principale per questa classe.","❌ SBAGLIATO. L'acqua può essere usata su molti incendi all'aperto. Le limitazioni dipendono dalla natura del combustibile, non dalla posizione."] },
          { q: "Le schiume sono agenti estinguenti costituiti da:", opts: ["Sostanze liquide che si trasformano in gas inerti quando utilizzate","Una miscela di acqua, liquido schiumogeno e aria (o altro gas inerte)","Polveri chimiche umidificate con solventi speciali","Bolle di anidride carbonica pura"], ans: 1, exps: ["❌ SBAGLIATO. Le schiume non si trasformano in gas: rimangono allo stato di schiuma (aggregato di bolle) sulla superficie del combustibile.","✅ CORRETTO! La SCHIUMA è composta da: ACQUA (90-95%) + LIQUIDO SCHIUMOGENO (5-10%) + ARIA o gas inerte. L'azione estinguente è per SOFFOCAMENTO (manto impermeabile) e RAFFREDDAMENTO. Rapporto di espansione: bassa (<1:20), media (1:20-1:200), alta (>1:200).","❌ SBAGLIATO. Le polveri umidificate non formano schiuma. Le polveri antincendio sono agenti estinguenti completamente diversi.","❌ SBAGLIATO. La CO₂ è un agente estinguente separato. Le schiume usano aria comune per creare le bolle."] },
          { q: "Le schiume hanno le stesse limitazioni di impiego dell'acqua?", opts: ["No, la schiuma può essere usata su qualsiasi tipo di incendio","Sì, essendo l'acqua un componente essenziale (90-95%), la schiuma ha le stesse limitazioni dell'acqua","No, la schiuma è completamente sicura su tutti i materiali","Solo parzialmente, per gli incendi di classe D"], ans: 1, exps: ["❌ SBAGLIATO. La schiuma ha limitazioni importanti, essendo composta principalmente da acqua.","✅ CORRETTO! Sì. Poiché la schiuma contiene il 90-95% di ACQUA, ha le STESSE LIMITAZIONI: NON usare su sodio/potassio (produce H₂ esplosivo), NON usare su impianti elettrici in tensione (l'acqua conduce elettricità), NON usare su sostanze che reagiscono violentemente con l'acqua.","❌ SBAGLIATO. La schiuma non è sicura su tutti i materiali. Il contenuto d'acqua la rende reattiva con le stesse sostanze con cui reagisce l'acqua.","❌ SBAGLIATO. Le limitazioni della schiuma non riguardano solo la classe D. Si applicano a tutte le situazioni in cui l'acqua è controindicata."] },
          { q: "Le polveri antincendio agiscono per:", opts: ["Solo raffreddamento","Solo soffocamento riducendo l'ossigeno","Inibizione chimica (anticatalisi), soffocamento e raffreddamento","Solo inibizione chimica senza effetti fisici"], ans: 2, exps: ["❌ SBAGLIATO. Il raffreddamento è solo UNO dei tre meccanismi. Le polveri agiscono principalmente per inibizione chimica.","❌ SBAGLIATO. Il soffocamento è un effetto secondario. L'azione principale delle polveri è l'inibizione chimica della reazione a catena.","✅ CORRETTO! Le polveri agiscono con TRIPLICE meccanismo: 1) INIBIZIONE CHIMICA (anticatalisi): interrompono la reazione a catena della combustione — principale azione; 2) SOFFOCAMENTO: la CO₂ prodotta dalla decomposizione diluisce l'O₂; 3) RAFFREDDAMENTO: assorbimento di calore dalla superficie del combustibile.","❌ SBAGLIATO. Le polveri hanno anche effetti fisici importanti (soffocamento e raffreddamento), non solo chimici."] },
          { q: "Le polveri sono idonee per qualunque classe di incendio?", opts: ["Sì, le polveri ABC sono universali per tutte le classi","No: polveri polivalenti per A, B, C; polveri speciali per classe D; non per classe F","No, le polveri sono adatte solo per fuochi di classe B","Sì, basta aumentare la quantità per qualsiasi tipo di incendio"], ans: 1, exps: ["❌ SBAGLIATO. Le polveri ABC non coprono la classe D (metalli) né la classe F (oli da cucina). Per queste classi servono agenti specifici.","✅ CORRETTO! Le polveri hanno composizioni diverse per classi diverse: POLVERI ABC (bicarbonato+fosfati): per classi A, B e C; POLVERI BC: solo per B e C; POLVERI SPECIALI PER CLASSE D: specifiche per ogni metallo. Le polveri ordinarie su incendi di classe D possono essere pericolose.","❌ SBAGLIATO. Le polveri polivalenti (ABC) sono efficaci su tre classi di incendio, non solo la B.","❌ SBAGLIATO. Aumentare la quantità di una polvere non adatta non la rende efficace. Usare la polvere sbagliata su classe D può essere pericoloso."] },
          { q: "La CO₂ come agente estinguente agisce per:", opts: ["Solo inibizione chimica come le polveri","Solo raffreddamento a causa della bassa temperatura di uscita","Soffocamento (riduzione O₂) e raffreddamento (esce a circa -78°C)","Esaurimento del combustibile per reazione chimica"], ans: 2, exps: ["❌ SBAGLIATO. La CO₂ non ha azione di inibizione chimica. Quella è l'azione specifica delle polveri e degli halon.","❌ SBAGLIATO. Il raffreddamento è presente ma non è l'unica azione. Il soffocamento è altrettanto importante.","✅ CORRETTO! La CO₂ agisce con due meccanismi: 1) SOFFOCAMENTO: riduce la concentrazione di O₂ fino a valori che non sostengono la combustione; 2) RAFFREDDAMENTO: all'uscita si espande raggiungendo circa -78°C come 'neve carbonica'. NON lascia residui. È PERFETTAMENTE DIELETTRICA.","❌ SBAGLIATO. La CO₂ non reagisce con il combustibile per esaurirlo. Agisce sull'atmosfera circostante il focolaio."] },
          { q: "La CO₂ è sconsigliata su apparecchiature sensibili alle brusche variazioni di temperatura?", opts: ["No, è sempre la scelta migliore per apparecchiature elettroniche","Sì, perché uscendo a circa -78°C può danneggiare componenti sensibili al freddo","No, la CO₂ è a temperatura ambiente quindi sicura","Solo se le apparecchiature sono in funzione"], ans: 1, exps: ["❌ SBAGLIATO. Sebbene la CO₂ sia dielettrica e non lasci residui, la sua temperatura di -78°C può danneggiare componenti sensibili.","✅ CORRETTO! Sì. La CO₂ esce a circa -78°C come neve carbonica. Questo shock termico può DANNEGGIARE: apparecchiature elettroniche sensibili, valvole in vetro, pellicole, documenti, opere d'arte. In questi casi preferire CLEAN AGENT (gas alternativi agli halon).","❌ SBAGLIATO. La CO₂ NON è a temperatura ambiente quando esce dall'estintore. Raggiunge -78°C per espansione adiabatica.","❌ SBAGLIATO. Il danno da shock termico può verificarsi anche su apparecchiature spente."] },
          { q: "Gli estintori portatili sono da usare per:", opts: ["L'estinzione completa di incendi anche generalizzati","Pronto intervento sui PRINCIPI D'INCENDIO (fuochi nella fase iniziale)","Solo come integrazione agli impianti sprinkler","Uso esclusivo da parte dei Vigili del Fuoco"], ans: 1, exps: ["❌ SBAGLIATO. Gli estintori portatili NON sono adatti per incendi generalizzati. Dopo il flash-over, l'intervento con estintori è inutile e pericoloso.","✅ CORRETTO! Gli estintori sono presidi di BASE per il PRIMO INTERVENTO su PRINCIPI D'INCENDIO nella fase iniziale. Portatatile = massa ≤ 20 kg; carrellato = massa > 20 kg (fino a 150 kg di carica). La capacità estinguente è indicata con un codice (es. 34A 233BC).","❌ SBAGLIATO. Gli estintori sono presidi autonomi di primo intervento, non dipendenti dagli sprinkler.","❌ SBAGLIATO. Gli estintori sono destinati all'uso da parte di TUTTI i lavoratori (dopo formazione) e degli addetti antincendio."] },
          { q: "La carica degli estintori portatili in ambienti accessibili al pubblico:", opts: ["Non ha limiti di peso se l'estintore è omologato","Non può essere superiore a 6 kg o 6 litri","Non può essere superiore a 12 kg o 12 litri","Non può essere superiore a 20 kg"], ans: 1, exps: ["❌ SBAGLIATO. Esistono limiti specifici per gli ambienti accessibili al pubblico per garantire la sicurezza degli occupanti.","✅ CORRETTO! Negli ambienti accessibili al pubblico, la carica degli estintori portatili NON può superare 6 kg o 6 litri. Estintori con cariche superiori sono ammessi SOLO in ambienti NON accessibili al pubblico, o accessibili solo se accompagnati permanentemente da personale addetto.","❌ SBAGLIATO. Il limite di 12 kg non esiste nella normativa per gli ambienti pubblici. Il limite è 6 kg/litri.","❌ SBAGLIATO. 20 kg è il limite totale per essere classificato come 'portatile'. Il limite per ambienti pubblici sulla CARICA è 6 kg/litri."] },
          { q: "Gli estintori con agente dielettrico (polvere, CO₂) sono idonei su impianti elettrici:", opts: ["No, mai: qualsiasi estintore è pericoloso su impianti elettrici","Sì, su impianti e apparecchiature fino a 1000V e alla distanza di 1 metro","Sì, senza limiti di tensione e distanza","Solo se l'impianto è stato preventivamente sezionato"], ans: 1, exps: ["❌ SBAGLIATO. Gli estintori con agenti dielettrici (polvere, CO₂) possono essere usati su impianti elettrici in specifiche condizioni.","✅ CORRETTO! Gli estintori con agente DIELETTRICO (polvere ABC, CO₂) sono idonei su impianti elettrici FINO A 1000V alla distanza di ALMENO 1 METRO. Gli estintori a base d'acqua sono idonei solo se superano la specifica PROVA DIELETTRICA prevista dalla norma UNI EN 3-7.","❌ SBAGLIATO. Esistono limiti precisi di tensione (1000V) e distanza (1 metro) che devono essere rispettati.","❌ SBAGLIATO. I limiti si applicano agli impianti IN TENSIONE. Per impianti sezionati non ci sono problemi."] },
          { q: "Gli estintori devono essere collocati:", opts: ["In qualunque posizione, anche nascosti","In posizione visibile e raggiungibile, lungo i percorsi d'esodo, con impugnature a circa 110 cm dal pavimento","Solo nei locali con maggior rischio, in armadietti","Solo in prossimità delle uscite principali"], ans: 1, exps: ["❌ SBAGLIATO. Gli estintori nascosti non possono essere usati tempestivamente. La visibilità immediata è essenziale per il primo intervento.","✅ CORRETTO! Gli estintori devono essere: FACILMENTE VISIBILI (con segnaletica), RAGGIUNGIBILI (lungo percorsi d'esodo, vicino a uscite e aree a rischio), impugnature a circa 110 cm dal pavimento (accessibilità per tutti incluse persone in carrozzina). Classe A: max 20-40m; Classe B: max 15m.","❌ SBAGLIATO. Gli estintori nascosti in armadietti non garantiscono l'accesso immediato in emergenza.","❌ SBAGLIATO. L'altezza delle impugnature (~110 cm) è prescritta. Non è sufficiente posizionarli solo alle uscite principali."] },
          { q: "La rete idrica antincendio (rete idranti) è:", opts: ["Un impianto fisso ad azionamento automatico come gli sprinkler","Un impianto di protezione ATTIVA ad azionamento MANUALE per il controllo degli incendi","Un sistema di segnalazione dell'incendio","Un impianto di prevenzione passiva come la compartimentazione"], ans: 1, exps: ["❌ SBAGLIATO. La rete idranti è ad azionamento MANUALE, non automatico. Gli sprinkler sono l'impianto automatico a pioggia.","✅ CORRETTO! La rete idranti è un impianto di PROTEZIONE ATTIVA ad azionamento MANUALE. Comprende: alimentazione idrica, rete di tubazioni ad anello, attacchi di mandata per autopompa VVF, valvole, apparecchi erogatori (idranti a muro DN 45 con manichetta ~20m, naspi DN 25 con tubazione semirigida max 30m). Permanentemente in pressione.","❌ SBAGLIATO. La rete idranti è un sistema di SPEGNIMENTO, non di segnalazione. I sistemi di segnalazione sono gli IRAI.","❌ SBAGLIATO. La protezione passiva non richiede intervento umano. La rete idranti richiede azionamento manuale da parte degli addetti."] },
          { q: "Un impianto automatico a pioggia sprinkler serve a:", opts: ["Spegnere definitivamente qualsiasi incendio anche dopo il flash-over","Assicurare una pronta risposta rivelando l'incendio e controllandolo, così che l'estinzione possa essere completata con altri mezzi","Sostituire completamente l'intervento dei Vigili del Fuoco","Erogare acqua contemporaneamente in tutto il locale ad ogni attivazione dell'allarme"], ans: 1, exps: ["❌ SBAGLIATO. Lo sprinkler CONTROLLA l'incendio ma non garantisce lo spegnimento definitivo in tutti i casi.","✅ CORRETTO! Lo sprinkler svolge un'azione di CONTROLLO: mantiene l'incendio in uno stato di 'non sviluppo' o dimensioni limitate, così che possa essere estinto dalle squadre. Gli ugelli sono CHIUSI con elemento termosensibile (bulbo rosso = 68°C) che si apre SOLO sopra il focolaio.","❌ SBAGLIATO. Lo sprinkler non può sostituire l'intervento VVF. Serve sempre la verifica dello spegnimento.","❌ SBAGLIATO. Nello sprinkler a umido si aprono SOLO gli ugelli sopra il focolaio. Erogare ovunque è caratteristica degli impianti a DILUVIO."] },
          { q: "Il controllo e la manutenzione dei presidi antincendio deve essere effettuata:", opts: ["Da qualunque operatore che si dichiari idoneo","Da tecnici manutentori qualificati (D.M. 1/09/2021), con responsabilità in capo al datore di lavoro","Solo dai Vigili del Fuoco durante le ispezioni","La manutenzione non è obbligatoria se i presidi sono nuovi"], ans: 1, exps: ["❌ SBAGLIATO. La sola autodichiarazione di idoneità non è sufficiente. Il D.M. 1/09/2021 introduce la qualificazione obbligatoria.","✅ CORRETTO! Il DATORE DI LAVORO è RESPONSABILE. Il D.M. 1/09/2021 introduce la QUALIFICAZIONE OBBLIGATORIA dei manutentori: devono aver seguito uno specifico percorso di formazione e superato un esame presso commissione VVF.","❌ SBAGLIATO. I VVF effettuano ispezioni di controllo, ma la manutenzione periodica deve essere svolta da manutentori qualificati designati dal datore di lavoro.","❌ SBAGLIATO. La manutenzione è SEMPRE obbligatoria. Senza manutenzione i presidi potrebbero non funzionare quando serve."] },
          { q: "La 'sorveglianza' dei presidi antincendio consiste in:", opts: ["Le stesse operazioni del controllo periodico tecnico","Controlli visivi per verificare che i presidi siano nelle normali condizioni operative, fruibili e privi di danni evidenti — può farla il lavoratore","La revisione annuale completa di tutti i presidi","Solo il controllo del manometro degli estintori"], ans: 1, exps: ["❌ SBAGLIATO. Sorveglianza e controllo periodico sono DISTINTI. Il controllo periodico richiede il tecnico manutentore qualificato.","✅ CORRETTO! La SORVEGLIANZA (D.M. 1/09/2021) = controlli VISIVI tra due controlli periodici per verificare che i presidi: siano PRESENTI, siano FRUIBILI (accessibili, non ostruiti), non abbiano DANNI evidenti, siano correttamente SEGNALATI. Può essere effettuata dai LAVORATORI dopo adeguate ISTRUZIONI.","❌ SBAGLIATO. La revisione annuale è parte del CONTROLLO PERIODICO, non della sorveglianza.","❌ SBAGLIATO. La sorveglianza comprende molti controlli visivi su tutti i presidi (estintori, idranti, naspi, porte tagliafuoco, rivelatori)."] }
        ]
      },
      strategia: {
        label: "🏗️ Strategia antincendio",
        color: "#2e7d32",
        questions: [
          { q: "La reazione al fuoco di un materiale rappresenta:", opts: ["La capacità portante della struttura in condizioni di incendio","Il comportamento di un materiale che con la sua decomposizione PARTECIPA al fuoco al quale è stato sottoposto","La capacità di un elemento di impedire il passaggio dei fumi","La velocità di propagazione delle fiamme in un compartimento"], ans: 1, exps: ["❌ SBAGLIATO. La capacità portante in caso di incendio è la prestazione R (Resistenza) della RESISTENZA AL FUOCO, non della reazione al fuoco.","✅ CORRETTO! La REAZIONE AL FUOCO misura quanto un materiale PARTECIPA alla combustione (contribuisce all'incendio) quando è esposto al fuoco. Classi ITALIANE: 0 (incombustibile) → 1 → 2 → 3 → 4 → 5. Classi EUROPEE: A1 → A2 → B → C → D → E → F. Determinata SPERIMENTALMENTE in laboratorio.","❌ SBAGLIATO. La capacità di impedire il passaggio dei fumi è la prestazione E (Tenuta) della RESISTENZA AL FUOCO.","❌ SBAGLIATO. La velocità di propagazione dell'incendio è il parametro δα del profilo di rischio vita, non la reazione al fuoco del singolo materiale."] },
          { q: "La misura antincendio 'reazione al fuoco' è:", opts: ["Una misura di protezione attiva nella fase generalizzata dell'incendio","Una misura di protezione PASSIVA che agisce nella fase INIZIALE dell'incendio, limitando innesco e propagazione","Una misura preventiva che riduce la probabilità di innesco","Una misura gestionale riguardante la formazione degli addetti"], ans: 1, exps: ["❌ SBAGLIATO. La reazione al fuoco è PASSIVA (non richiede intervento) e agisce soprattutto nella fase iniziale (PRE-FLASHOVER), non nella fase generalizzata.","✅ CORRETTO! La reazione al fuoco è una misura di PROTEZIONE PASSIVA fondamentale nella FASE INIZIALE dell'incendio (pre-flashover). Limitando quanto i materiali partecipano alla combustione, rallenta la propagazione e dà più tempo all'esodo e all'intervento.","❌ SBAGLIATO. La reazione al fuoco è una misura di PROTEZIONE, non di prevenzione. La prevenzione riduce la probabilità di innesco; la protezione limita gli effetti dell'incendio.","❌ SBAGLIATO. La reazione al fuoco non riguarda la formazione del personale, ma le caratteristiche fisico-chimiche dei materiali."] },
          { q: "Con il simbolo REI 60 si identifica un elemento costruttivo che:", opts: ["Conserva per 60 minuti solo la capacità portante","Conserva per 60 minuti la capacità portante e la tenuta ai fumi","Conserva per 60 minuti la capacità portante (R), la tenuta ai fumi (E) e l'isolamento termico (I)","Conserva per 60 minuti solo la tenuta e l'isolamento"], ans: 2, exps: ["❌ SBAGLIATO. Solo la capacità portante sarebbe indicata con il simbolo R 60 (senza E e I).","❌ SBAGLIATO. Capacità portante + tenuta senza isolamento sarebbe indicata con RE 60.","✅ CORRETTO! REI 60 = tutte e TRE le prestazioni garantite per 60 minuti: R (capacità portante), E (tenuta = impedisce passaggio di fumi e gas caldi), I (isolamento termico = limita il trasferimento di calore). Tipico di muri divisori tra compartimenti, solai e porte tagliafuoco.","❌ SBAGLIATO. Solo tenuta + isolamento senza portante sarebbe indicata con EI 60. Tipico delle porte tagliafuoco non strutturali."] },
          { q: "La finalità della compartimentazione antincendio è:", opts: ["Solo limitare la propagazione verso attività esterne","Solo proteggere le strutture portanti dall'azione del fuoco","Limitare la propagazione dell'incendio e dei suoi effetti sia verso altre attività sia all'interno della stessa attività","Solo ritardare l'intervento dei VVF fino all'evacuazione completa"], ans: 2, exps: ["❌ SBAGLIATO. La compartimentazione limita la propagazione sia VERSO L'ESTERNO sia ALL'INTERNO (tra diversi compartimenti della stessa attività).","❌ SBAGLIATO. La protezione delle strutture portanti è obiettivo della RESISTENZA AL FUOCO. La compartimentazione ha uno scopo più ampio.","✅ CORRETTO! La COMPARTIMENTAZIONE divide l'edificio in compartimenti separati da elementi REI/EI per LIMITARE la propagazione spaziale e temporale dell'incendio. Protegge sia verso l'esterno (verso altre attività) sia internamente. Dà tempo all'esodo e permette l'intervento delle squadre.","❌ SBAGLIATO. La compartimentazione non ritarda l'intervento VVF, anzi facilita il lavoro dei soccorritori contenendo l'incendio in un'area definita."] },
          { q: "La porta tagliafuoco (porta EI) deve essere:", opts: ["Sempre aperta durante l'orario di lavoro per non ostacolare il deflusso","Normalmente CHIUSA, adeguatamente segnalata su entrambi i lati e oggetto di sorveglianza, controllo e manutenzione","Aperta nelle ore notturne e chiusa di giorno","Sempre chiusa a chiave per impedire la propagazione dei fumi"], ans: 1, exps: ["❌ SBAGLIATO. Le porte tagliafuoco aperte non garantiscono la compartimentazione. La posizione normale è CHIUSA.","✅ CORRETTO! Le porte EI devono essere: normalmente CHIUSE (o con chiusura automatica asservita all'IRAI), segnalate con apposita segnaletica su ENTRAMBI I LATI ('Porta tagliafuoco tenere chiusa'), oggetto di SORVEGLIANZA e MANUTENZIONE periodica.","❌ SBAGLIATO. Non c'è distinzione oraria. Le porte tagliafuoco devono essere normalmente chiuse SEMPRE.","❌ SBAGLIATO. Le porte tagliafuoco NON devono essere chiuse a chiave: devono potersi aprire facilmente per consentire il passaggio delle persone e dei soccorritori."] },
          { q: "La finalità del sistema d'esodo è:", opts: ["Solo evacuare rapidamente l'edificio in caso di incendio","Assicurare che gli occupanti raggiungano un luogo sicuro o permanganno al sicuro, autonomamente o con assistenza, PRIMA che l'incendio determini condizioni incapacitanti","Solo garantire l'accessibilità dei VVF all'edificio","Solo limitare la propagazione del fumo nelle vie di esodo"], ans: 1, exps: ["❌ SBAGLIATO. Il sistema d'esodo non è solo 'evacuare rapidamente'. Include anche la permanenza in sicurezza (spazi calmi) e prevede diverse modalità.","✅ CORRETTO! Il SISTEMA D'ESODO deve permettere a TUTTI gli occupanti (inclusi disabili, anziani, bambini, degenti) di raggiungere un luogo sicuro — autonomamente o con assistenza — PRIMA che l'incendio produca condizioni pericolose. Modalità: esodo simultaneo, per fasi, orizzontale progressivo, protezione sul posto.","❌ SBAGLIATO. L'accessibilità dei VVF è obiettivo della misura OPERATIVITÀ ANTINCENDIO, non del sistema d'esodo.","❌ SBAGLIATO. La limitazione del fumo nelle vie d'esodo è obiettivo del CONTROLLO FUMO E CALORE (SEFC)."] },
          { q: "Per 'corridoio cieco' nel sistema d'esodo si intende:", opts: ["Un corridoio senza finestre o illuminazione naturale","Una porzione di via d'esodo da cui è possibile l'esodo in UNA SOLA DIREZIONE","Un corridoio compartimentato con porte tagliafuoco su entrambi i lati","Un percorso d'esodo a prova di fumo interamente confinato"], ans: 1, exps: ["❌ SBAGLIATO. L'assenza di finestre non definisce un corridoio cieco. La caratteristica è la mancanza di vie d'esodo alternative.","✅ CORRETTO! Il CORRIDOIO CIECO è una porzione di via d'esodo da cui si può uscire in UN'UNICA DIREZIONE. Se l'incendio si sviluppa in quella direzione, gli occupanti sono intrappolati. Lunghezze massime: 10-45m (circa la METÀ rispetto alle vie d'esodo: 20-70m).","❌ SBAGLIATO. La presenza di porte tagliafuoco definisce la compartimentazione, non il 'corridoio cieco'.","❌ SBAGLIATO. Un percorso a prova di fumo non ha necessariamente una sola direzione d'esodo."] },
          { q: "Per affollamento > 1000 occupanti, la larghezza minima delle vie d'esodo orizzontali è:", opts: ["Maggiore o uguale a 900 mm","Maggiore o uguale a 1000 mm","Maggiore o uguale a 1200 mm (1,2 m), a prescindere dal numero di vie disponibili","Definita dal progettista senza limiti minimi"], ans: 2, exps: ["❌ SBAGLIATO. 900 mm è il minimo per affollamenti ≤ 300 occupanti.","❌ SBAGLIATO. 1000 mm è il minimo per affollamenti > 300 occupanti. Per > 1000 persone serve 1200 mm.","✅ CORRETTO! Per affollamento > 1000 occupanti (o > 200 persone in piedi con densità > 0,7 pers/m²): larghezza minima = 1200 mm (1,2 m), a prescindere dal numero di vie d'esodo disponibili. Per ≤ 300 occ → 900mm; per ≤ 50 occ → 800mm.","❌ SBAGLIATO. Esistono larghezze minime prescritte dalla normativa che devono essere rispettate."] },
          { q: "Le vie d'esodo devono avere un'altezza minima di:", opts: ["1,80 m senza eccezioni","2 metri, con possibili eccezioni per brevi tratti in aree con personale specificamente formato","2,50 m per garantire il passaggio con attrezzature antincendio","Non è prescritta un'altezza minima"], ans: 1, exps: ["❌ SBAGLIATO. L'altezza minima è 2 metri, non 1,80.","✅ CORRETTO! Altezza minima vie d'esodo = 2 METRI. Eccezione ammessa: brevi tratti segnalati in aree con ESCLUSIVA presenza di personale specificamente FORMATO, oppure con presenza OCCASIONALE e LIMITATA di occupanti (es. locali impianti, piccoli depositi).","❌ SBAGLIATO. L'altezza minima è 2 metri, non 2,50.","❌ SBAGLIATO. L'altezza minima di 2 metri è prescritta dalla normativa."] },
          { q: "La misura antincendio 'Rivelazione ed Allarme' (IRAI) ha come obiettivo:", opts: ["Solo lo spegnimento automatico dell'incendio tramite sprinkler","Sorvegliare gli ambiti, rivelare precocemente l'incendio, diffondere l'allarme e attivare le misure protettive e gestionali","Solo avvisare i Vigili del Fuoco","Solo attivare l'evacuazione dei locali"], ans: 1, exps: ["❌ SBAGLIATO. Gli IRAI rivelano l'incendio e danno l'allarme, ma non spengono. Lo spegnimento è compito degli impianti sprinkler o delle squadre.","✅ CORRETTO! Gli IRAI (Impianti di Rivelazione e Allarme Incendio) hanno molteplici obiettivi: SORVEGLIARE gli ambiti, RIVELARE precocemente l'incendio, DIFFONDERE l'allarme e ATTIVARE: misure tecniche (sprinkler, compartimentazione, EFC, arresto impianti) + misure gestionali (piano di emergenza, esodo).","❌ SBAGLIATO. Avvisare i VVF è solo una funzione secondaria. La principale è la rivelazione precoce e l'allarme locale.","❌ SBAGLIATO. Attivare l'evacuazione è solo una delle molte funzioni. Gli IRAI possono anche chiudere porte tagliafuoco, fermare impianti di ventilazione, attivare sprinkler."] },
          { q: "I punti di segnalazione manuale (pulsanti di allarme) devono essere raggiungibili con percorsi:", opts: ["Non superiori a 50 m da qualsiasi punto","Compresi tra 15 e 30 m, in relazione al rischio incendio","Non superiori a 10 m dalle uscite di sicurezza","Senza limite di distanza se visibili"], ans: 1, exps: ["❌ SBAGLIATO. 50 m è troppo lontano per garantire un intervento rapido. La distanza massima è 30 m.","✅ CORRETTO! I pulsanti di segnalazione manuale devono essere raggiungibili con percorsi compresi tra 15 e 30 m (in funzione del rischio). Almeno 2 per zona. Altezza di installazione: 1,0-1,6 m (preferibilmente ~110 cm per accessibilità disabili). Posizione: visibile, segnalata, facilmente accessibile, vicino alle uscite d'esodo.","❌ SBAGLIATO. 10 m è una distanza troppo riduttiva. I pulsanti devono essere distribuiti uniformemente nel locale.","❌ SBAGLIATO. La visibilità non è sufficiente senza un limite di distanza. In emergenza, anche 40-50 m possono essere troppo lontani."] },
          { q: "I Sistemi di Evacuazione Fumo e Calore (SEFC) creano e mantengono:", opts: ["Uno strato d'aria libera nella porzione SUPERIORE dell'ambiente","Uno strato d'aria libera nella porzione INFERIORE dell'ambiente, evacuando fumi e calore verso l'alto","Un'atmosfera completamente priva di fumo in tutto il volume","Uno strato di fumo ad alta quota per proteggere le persone in basso"], ans: 1, exps: ["❌ SBAGLIATO. È vero il contrario. Il fumo caldo sale per convezione e si stratifica in ALTO. I SEFC mantengono LIBERA LA PORZIONE INFERIORE.","✅ CORRETTO! I SEFC creano uno strato d'aria libera nella PORZIONE INFERIORE dell'ambiente (dove si trovano le persone) evacuando i fumi caldi verso l'alto e poi verso l'esterno. Obiettivi: vie d'esodo libere, facilitazione VVF, ritardo/prevenzione del flash-over, protezione strutture e contenuto.","❌ SBAGLIATO. I SEFC non possono rendere l'intero volume privo di fumo in caso di incendio attivo. Mantengono libera solo la porzione inferiore.","❌ SBAGLIATO. Il fumo stratificato in alto non 'protegge' le persone. I SEFC mantengono il fumo lontano dalle vie di percorrenza e respiro."] },
          { q: "La Gestione della Sicurezza Antincendio (GSA) si divide in:", opts: ["Solo gestione in esercizio ordinario","Gestione in ESERCIZIO (attività ordinaria) e gestione in EMERGENZA (attivazione piano di emergenza)","Solo gestione dell'emergenza e delle evacuazioni","Gestione preventiva e gestione correttiva"], ans: 1, exps: ["❌ SBAGLIATO. La GSA comprende anche la gestione in emergenza. Le due componenti sono inseparabili.","✅ CORRETTO! La GSA si divide in: GSA IN ESERCIZIO (misure preventive, segnaletica, verifica divieti, manutenzione, formazione, prove di evacuazione, gestione cantieri) + GSA IN EMERGENZA (attivazione del piano di emergenza, azioni degli addetti, supporto ai VVF).","❌ SBAGLIATO. La gestione ordinaria (in esercizio) è altrettanto importante. La preparazione quotidiana determina l'efficacia in emergenza.","❌ SBAGLIATO. 'Preventiva' e 'correttiva' non sono le denominazioni ufficiali della GSA. La distinzione ufficiale è IN ESERCIZIO vs IN EMERGENZA."] }
        ]
      },
      segnaletica: {
        label: "⚠️ Segnaletica di sicurezza",
        color: "#e65100",
        questions: [
          { q: "I cartelli rotondi con pittogramma nero su fondo bianco e bordo e banda rossa (45°) sono:", opts: ["Segnali di avvertimento","Segnali di prescrizione","Segnali di divieto","Segnali per attrezzature antincendio"], ans: 2, exps: ["❌ SBAGLIATO. I segnali di AVVERTIMENTO hanno forma TRIANGOLARE con pittogramma nero su fondo GIALLO e bordo nero.","❌ SBAGLIATO. I segnali di PRESCRIZIONE hanno forma rotonda con pittogramma BIANCO su fondo AZZURRO.","✅ CORRETTO! I segnali di DIVIETO hanno: forma ROTONDA, pittogramma NERO su fondo BIANCO, bordo e BANDA DIAGONALE (a 45°) ROSSI. Il rosso deve coprire almeno il 35%. Esempi: divieto di fumo, divieto di usare fiamme libere, divieto di usare acqua sull'incendio.","❌ SBAGLIATO. I segnali per ATTREZZATURE ANTINCENDIO hanno forma quadrata/rettangolare con pittogramma BIANCO su fondo ROSSO."] },
          { q: "I cartelli triangolari con pittogramma nero su fondo giallo e bordo nero sono:", opts: ["Segnali di divieto","Segnali di avvertimento","Segnali di prescrizione","Segnali di salvataggio"], ans: 1, exps: ["❌ SBAGLIATO. I segnali di DIVIETO sono ROTONDI con bordo e banda ROSSI su fondo bianco. Non sono triangolari.","✅ CORRETTO! I segnali di AVVERTIMENTO hanno: forma TRIANGOLARE, pittogramma NERO su fondo GIALLO, bordo NERO. Il giallo deve coprire almeno il 50%. Esempi: pericolo generico (!), materiali infiammabili, rischio elettrico, pericolo esplosione, segnale ATEX (EX).","❌ SBAGLIATO. I segnali di PRESCRIZIONE sono ROTONDI con pittogramma BIANCO su fondo AZZURRO.","❌ SBAGLIATO. I segnali di SALVATAGGIO sono QUADRATI o RETTANGOLARI con pittogramma BIANCO su fondo VERDE."] },
          { q: "I cartelli rotondi con pittogramma bianco su fondo azzurro sono:", opts: ["Segnali di divieto","Segnali di avvertimento","Segnali di salvataggio","Segnali di prescrizione"], ans: 3, exps: ["❌ SBAGLIATO. I segnali di DIVIETO sono rotondi ma con pittogramma NERO su fondo BIANCO e bordo/banda ROSSI.","❌ SBAGLIATO. I segnali di AVVERTIMENTO sono TRIANGOLARI con fondo GIALLO, non rotondi con fondo azzurro.","❌ SBAGLIATO. I segnali di SALVATAGGIO sono QUADRATI o RETTANGOLARI con pittogramma bianco su fondo VERDE.","✅ CORRETTO! I segnali di PRESCRIZIONE hanno: forma ROTONDA, pittogramma BIANCO su fondo AZZURRO (≥ 50%). Indicano comportamenti OBBLIGATORI. Esempi: obbligo casco, obbligo DPI respiratorio, obbligo guanti protettivi, obbligo protezione degli occhi."] },
          { q: "I cartelli quadrati o rettangolari con pittogramma bianco su fondo verde sono:", opts: ["Segnali per attrezzature antincendio","Segnali di divieto","Segnali di salvataggio e soccorso","Segnali di prescrizione"], ans: 2, exps: ["❌ SBAGLIATO. I segnali per ATTREZZATURE ANTINCENDIO hanno forma quadrata/rettangolare ma con pittogramma bianco su fondo ROSSO.","❌ SBAGLIATO. I segnali di DIVIETO sono rotondi con pittogramma nero su fondo bianco con bordo/banda rossi.","✅ CORRETTO! I segnali di SALVATAGGIO E SOCCORSO hanno: forma QUADRATA o RETTANGOLARE, pittogramma BIANCO su fondo VERDE (≥ 50%). Esempi: uscita di emergenza, frecce direzione esodo, punto di raccolta, spazio calmo, pronto soccorso, doccia di emergenza.","❌ SBAGLIATO. I segnali di PRESCRIZIONE sono ROTONDI con pittogramma bianco su fondo AZZURRO."] },
          { q: "I cartelli quadrati o rettangolari con pittogramma bianco su fondo rosso sono:", opts: ["Segnali di divieto","Segnali di salvataggio","Segnali per le ATTREZZATURE ANTINCENDIO","Segnali di avvertimento"], ans: 2, exps: ["❌ SBAGLIATO. I segnali di DIVIETO sono ROTONDI con bordo e banda rossi su fondo bianco, non quadrati con fondo rosso.","❌ SBAGLIATO. I segnali di SALVATAGGIO sono quadrati/rettangolari ma con fondo VERDE, non rosso.","✅ CORRETTO! I segnali per le ATTREZZATURE ANTINCENDIO hanno: forma QUADRATA o RETTANGOLARE, pittogramma BIANCO su fondo ROSSO (≥ 50%). Esempi: estintore portatile, estintore carrellato, naspo antincendio, idrante, pulsante di allarme manuale.","❌ SBAGLIATO. I segnali di AVVERTIMENTO sono TRIANGOLARI con fondo GIALLO e bordo nero."] },
          { q: "Il segnale ATEX (triangolo giallo con scritta EX) indica:", opts: ["Un'area dove è vietato l'accesso agli estintori","Aree in cui possono formarsi ATMOSFERE ESPLOSIVE","Un segnale di prescrizione per l'uso di esplosivi","Un cartello di divieto per sostanze infiammabili"], ans: 1, exps: ["❌ SBAGLIATO. Il segnale ATEX non ha nulla a che fare con gli estintori.","✅ CORRETTO! Il segnale EX (triangolo GIALLO con scritta EX nera) è il segnale di AVVERTIMENTO obbligatorio per le ZONE ATEX: aree in cui possono formarsi atmosfere esplosive. Ai sensi del D.Lgs 81/2008 Titolo XI, deve essere apposto agli accessi delle zone classificate (Zona 0, 1, 2 per gas; Zona 20, 21, 22 per polveri).","❌ SBAGLIATO. Il segnale ATEX è di AVVERTIMENTO (triangolo giallo), non di prescrizione (cerchio azzurro).","❌ SBAGLIATO. Il segnale ATEX è di AVVERTIMENTO, non di divieto. I cartelli di divieto hanno forma rotonda con bordo e banda rossi."] },
          { q: "La segnaletica di sicurezza contribuisce alla prevenzione e protezione dai rischi di incendio?", opts: ["No, è solo un adempimento burocratico obbligatorio","Sì, favorisce la corretta gestione dell'attività ai fini della sicurezza antincendio","Solo nelle grandi aziende con oltre 50 dipendenti","Solo se affiancata da sistemi di allarme automatici"], ans: 1, exps: ["❌ SBAGLIATO. La segnaletica non è solo burocrazia: ha un ruolo concreto e attivo nella sicurezza. Il D.Lgs 81/2008 la impone proprio perché è efficace.","✅ CORRETTO! SÌ. La segnaletica è OBBLIGATORIA (D.Lgs 81/2008, art. 163) quando i rischi non possono essere eliminati sufficientemente con altri mezzi. Contribuisce ATTIVAMENTE: indica dove sono i presidi antincendio, segna le vie d'esodo, avverte dei pericoli, prescrive i comportamenti corretti.","❌ SBAGLIATO. L'obbligo di segnaletica dipende dalla valutazione dei rischi, non dalla dimensione dell'azienda.","❌ SBAGLIATO. La segnaletica è efficace indipendentemente dalla presenza di altri sistemi."] },
          { q: "Con 'segnale di avvertimento' (D.Lgs 81/2008) si intende:", opts: ["Un segnale che vieta un comportamento pericoloso","Un segnale che prescrive un comportamento obbligatorio","Un segnale che avverte di un rischio o pericolo presente nell'ambiente","Un segnale che indica le uscite di sicurezza"], ans: 2, exps: ["❌ SBAGLIATO. Quello che vieta un comportamento è il segnale di DIVIETO (forma rotonda, rosso/bianco).","❌ SBAGLIATO. Quello che prescrive un comportamento è il segnale di PRESCRIZIONE (forma rotonda, azzurro/bianco).","✅ CORRETTO! Il SEGNALE DI AVVERTIMENTO avverte della presenza di un RISCHIO o PERICOLO. Ha forma TRIANGOLARE, pittogramma nero su fondo GIALLO, bordo nero. Esempi: pericolo generico, materiali infiammabili, rischio elettrico, atmosfera esplosiva, materiali corrosivi.","❌ SBAGLIATO. I segnali che indicano le uscite di sicurezza sono SEGNALI DI SALVATAGGIO (quadrato/rettangolare, verde/bianco)."] }
        ]
      },
      emergenza: {
        label: "📋 Emergenze e GSA",
        color: "#6a1b9a",
        questions: [
          { q: "Il Piano di Emergenza, redatto dal Datore di Lavoro, deve contenere:", opts: ["Solo le procedure di evacuazione degli occupanti","Le azioni dei lavoratori in caso di incendio, le procedure di evacuazione, le disposizioni per chiamare i VVF e le misure per persone con esigenze speciali","Solo i nominativi degli addetti antincendio","Solo la planimetria con le vie d'esodo"], ans: 1, exps: ["❌ SBAGLIATO. Le procedure di evacuazione sono solo UNA delle componenti obbligatorie del piano.","✅ CORRETTO! Il Piano di Emergenza (D.M. 2/9/2021) deve contenere OBBLIGATORIAMENTE: AZIONI dei lavoratori in caso di incendio, PROCEDURE DI EVACUAZIONE, disposizioni per chiamare i VVF al 115 (con indirizzo, tipo/gravità emergenza, feriti, sostanze pericolose, percorso accesso), MISURE SPECIFICHE per persone con esigenze speciali, PLANIMETRIE con presidi e vie d'esodo.","❌ SBAGLIATO. I nominativi degli addetti sono parte del piano, ma non l'unico contenuto.","❌ SBAGLIATO. La planimetria è allegata al piano ma non costituisce l'intero piano."] },
          { q: "Per più luoghi di lavoro nello stesso edificio con titolari diversi, i piani di emergenza devono essere:", opts: ["Completamente indipendenti","COORDINATI tra loro per garantire coerenza delle procedure","Redatti da un unico responsabile nominato dalla proprietà","Non è necessario redigerli"], ans: 1, exps: ["❌ SBAGLIATO. Piani indipendenti in uno stesso edificio potrebbero creare conflitti pericolosi in caso di emergenza.","✅ CORRETTO! Per più attività nello stesso edificio con titolari diversi, i piani DEVONO ESSERE COORDINATI: procedure di allarme compatibili, percorsi d'esodo non in conflitto, punti di raccolta definiti, comunicazioni tra i gestori delle emergenze delle diverse attività.","❌ SBAGLIATO. Ogni datore di lavoro redige il proprio piano, ma i piani devono essere coordinati.","❌ SBAGLIATO. Il Piano di Emergenza è SEMPRE OBBLIGATORIO per i luoghi di lavoro ai sensi del D.Lgs 81/2008."] },
          { q: "Gli addetti antincendio in condizioni ordinarie (GSA in ESERCIZIO) devono:", opts: ["Effettuare solo le prove di evacuazione annuali","Attuare le misure preventive, garantire la fruibilità delle vie d'esodo e svolgere le attività di sorveglianza dei presidi antincendio","Solo sorvegliare i presidi antincendio","Redigere e aggiornare il piano di emergenza"], ans: 1, exps: ["❌ SBAGLIATO. Le prove di evacuazione sono solo una parte della preparazione all'emergenza. In esercizio ordinario gli addetti svolgono molto di più.","✅ CORRETTO! In GSA IN ESERCIZIO (attività ordinaria), gli addetti antincendio: ATTUANO le misure preventive, GARANTISCONO la fruibilità delle vie d'esodo (verificano che siano libere da ostacoli), svolgono SORVEGLIANZA sui presidi antincendio (controlli visivi).","❌ SBAGLIATO. La sorveglianza è solo uno dei tre compiti in esercizio.","❌ SBAGLIATO. Il piano di emergenza è redatto dal DATORE DI LAVORO, non dagli addetti antincendio."] },
          { q: "Gli addetti antincendio in condizioni di EMERGENZA devono:", opts: ["Solo chiamare i VVF al 115 e aspettare il loro arrivo","Mettere in atto le azioni del piano d'emergenza: gestire l'evacuazione, eseguire comunicazioni, supportare i VVF e tentare lo spegnimento del principio d'incendio","Solo evacuare rapidamente senza preoccuparsi degli altri","Solo tentare lo spegnimento con estintori, qualunque sia l'entità dell'incendio"], ans: 1, exps: ["❌ SBAGLIATO. Chiamare i VVF è una delle azioni, ma non l'unica. Gli addetti devono intervenire attivamente nella gestione dell'emergenza.","✅ CORRETTO! In GSA IN EMERGENZA, gli addetti antincendio: mettono in atto il PIANO DI EMERGENZA, attuano le misure per l'EVACUAZIONE, eseguono le COMUNICAZIONI (inclusa chiamata VVF con tutte le info utili), supportano le SQUADRE DI SOCCORSO all'arrivo, tentano lo SPEGNIMENTO di principi d'incendio (solo quando possibile in sicurezza).","❌ SBAGLIATO. Gli addetti hanno la responsabilità di coordinare l'evacuazione e assistere i colleghi, specialmente le persone con esigenze speciali.","❌ SBAGLIATO. Tentare lo spegnimento è appropriato solo per PRINCIPI D'INCENDIO nella fase iniziale e con via di fuga sicura. Per incendi sviluppati si deve evacuare."] },
          { q: "La maschera a filtro si può usare quando la concentrazione di ossigeno è:", opts: ["Inferiore al 6%","Non inferiore al 17%","Superiore al 25%","A qualsiasi concentrazione di ossigeno"], ans: 1, exps: ["❌ SBAGLIATO. Al 6% di O₂ siamo in pericolo immediato di vita. La maschera a filtro non può assolutamente essere usata a questa concentrazione.","✅ CORRETTO! Le maschere a FILTRO depurano l'aria ambiente ma non forniscono ossigeno aggiuntivo. DEVONO essere usate solo con O₂ NON INFERIORE AL 17% (limite minimo CEN). Sotto il 17% è obbligatorio l'uso di AUTORESPIRATORI a circuito aperto con aria compressa dalla bombola.","❌ SBAGLIATO. La maschera a filtro non è limitata alle atmosfere sovraossigenate (> 25%). Il limite riguarda il MINIMO di O₂ (17%).","❌ SBAGLIATO. La maschera a filtro NON può essere usata a qualsiasi concentrazione. Sotto il 17% di O₂ è obbligatorio l'autorespiratore."] },
          { q: "Gli autorespiratori a ciclo aperto dispongono di bombole contenenti:", opts: ["Ossigeno puro al 100%","Aria compressa (ossigeno + azoto nella composizione naturale)","Azoto puro","Miscela azoto-elio per immersioni"], ans: 1, exps: ["❌ SBAGLIATO. L'ossigeno puro è PERICOLOSO in spazi confinati: aumenta drasticamente il rischio di incendio/esplosione e può causare tossicità da ossigeno. Gli autorespiratori usano aria compressa.","✅ CORRETTO! Gli autorespiratori a CICLO APERTO usano ARIA COMPRESSA (composizione naturale: ~21% O₂, ~79% N₂) compressa a 200-300 bar. L'aria espirata viene scaricata nell'ambiente. Autonomia tipica: bombola da 7L a 200 bar → ~45 minuti a lavoro moderato. Segnale di riserva: fischio a ~50 bar residui.","❌ SBAGLIATO. L'azoto puro provoca asfissia per mancanza di ossigeno. Non è usato negli autorespiratori.","❌ SBAGLIATO. Le miscele azoto-elio sono usate in subacquea. Gli autorespiratori antincendio usano aria compressa normale."] },
          { q: "I respiratori a filtro si dividono in:", opts: ["Solo antipolvere e antigas","Antipolvere, antigas e combinati","Solo antigas e combinati","Solo antipolvere, antigas e antigas speciali"], ans: 1, exps: ["❌ SBAGLIATO. Esiste anche la categoria dei filtri COMBINATI (polveri + gas).","✅ CORRETTO! I respiratori a FILTRO si dividono in: ANTIPOLVERE (proteggono da polveri, fibre, fumi metallici, nebbie — filtro meccanico); ANTIGAS (proteggono da gas e vapori specifici — carbone attivo; ogni filtro è specifico per un tipo di gas!); COMBINATI (proteggono da gas/vapori E polveri).","❌ SBAGLIATO. Il filtro antipolvere esiste come categoria separata.","❌ SBAGLIATO. Non esiste la categoria 'antigas speciali'. I filtri antigas sono già specifici per diversi tipi di gas."] },
          { q: "Quante sono le zone ATEX per gas, vapori e nebbie?", opts: ["2 (zona 0, zona 1)","3 (zona 0, zona 1, zona 2)","4 (zona 0, zona 1, zona 2, zona 3)","3 (zona 10, zona 20, zona 30)"], ans: 1, exps: ["❌ SBAGLIATO. Esistono anche la zona 2 (rischio improbabile o di breve durata). Sono tre zone totali per gas.","✅ CORRETTO! Per GAS, VAPORI e NEBBIE esistono 3 zone ATEX: ZONA 0 (atmosfera esplosiva PERMANENTE o per lunghi periodi), ZONA 1 (atmosfera esplosiva PROBABILE in condizioni normali), ZONA 2 (atmosfera esplosiva IMPROBABILE o di breve durata). Per POLVERI: Zone 20, 21, 22 (stesso criterio).","❌ SBAGLIATO. Non esiste la 'zona 3' per gas/vapori. La terza zona si chiama ZONA 2.","❌ SBAGLIATO. Le zone 10, 20, 30 non esistono. Per i gas sono 0, 1, 2; per le polveri sono 20, 21, 22."] },
          { q: "Il datore di lavoro nel piano di emergenza deve prevedere per le persone con esigenze speciali:", opts: ["Nessuna misura specifica: il piano vale ugualmente per tutti","Adeguata assistenza e misure di supporto (dispositivi sensoriali, messaggi da altoparlanti, sistemi EVAC) per persone con ridotte capacità sensoriali o motorie","Solo comunicare ai VVF la presenza di persone disabili","Solo acquistare sedie di evacuazione per disabili motori"], ans: 1, exps: ["❌ SBAGLIATO. Un piano generico non è adeguato per persone con esigenze speciali. La normativa impone misure SPECIFICHE.","✅ CORRETTO! Il piano deve prevedere ADEGUATA ASSISTENZA per persone con esigenze speciali (disabili, anziani, donne in gravidanza, bambini). Misure specifiche: ALLARME ADATTATO (luci lampeggianti, scritte luminose, dispositivi a vibrazione per ipoacusici), messaggi da altoparlanti (EVAC), assistenti designati, SPAZI CALMI per chi non può evacuare autonomamente.","❌ SBAGLIATO. Comunicare ai VVF è utile ma non sufficiente. Le misure devono essere pianificate IN ANTICIPO.","❌ SBAGLIATO. Le sedie di evacuazione sono utili ma non l'unica misura. Il piano deve considerare tutte le tipologie di esigenze speciali."] },
          { q: "Immagazzinando combustibili che sviluppano vapori più pesanti dell'aria, il pericolo è maggiore:", opts: ["In locali sopraelevati o al piano terra","Nei locali sotterranei (scantinati, cantine, fosse)","All'aperto in presenza di vento","In qualsiasi locale indipendentemente dalla posizione"], ans: 1, exps: ["❌ SBAGLIATO. I vapori pesanti non rimangono in alto. Si accumulano in basso, quindi i locali sopraelevati sono meno pericolosi.","✅ CORRETTO! I vapori più PESANTI dell'aria (es. GPL, benzina: densità > aria) si accumulano nei punti più BASSI: locali sotterranei, cantine, fosse, cunicoli. Qui si concentrano raggiungendo concentrazioni nel campo di infiammabilità/esplodibilità. Le aperture di ventilazione devono essere A FILO PAVIMENTO per evacuare questi vapori.","❌ SBAGLIATO. All'aperto con vento i vapori si disperdono rapidamente. Il pericolo maggiore è nei luoghi confinati senza ventilazione.","❌ SBAGLIATO. Il rischio NON è uguale in tutti i locali. La posizione e la configurazione influenzano enormemente la pericolosità."] }
        ]
      }
    };

    const ALL_Q = Object.entries(QUIZ).flatMap(([k, d]) => d.questions.map(q => ({ ...q, cat: k, catLabel: d.label, catColor: d.color })));
    const MOTIV_OK = ["🎉 Perfetto! Sei un esperto!","🔥 Bravo! Stai bruciando di sapere!","💪 Eccellente! I VVF ti assumerebbero subito!","⭐ Risposta corretta! Campione!","🚒 Fantastico! Pronto all'intervento!","🏆 Sei il migliore del corso!","✅ Correttissimo! Continua così!","🌟 Straordinario!","🎯 Preciso come un VVF!"];
    const MOTIV_NO = ["❌ Risposta sbagliata! Ora sai perché.","🔴 Quasi! Ma questo punto è cruciale.","⚠️ Attenzione! Rileggi la spiegazione.","📚 Errore! Approfondiamo insieme.","🧯 Ops! Questo concetto va ripassato.","📖 Studia questo punto!"];
    const rand = arr => arr[Math.floor(Math.random() * arr.length)];
    const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);

    function App() {
      const [screen, setScreen] = useState("home");
      const [mode, setMode] = useState(null);
      const [questions, setQuestions] = useState([]);
      const [cur, setCur] = useState(0);
      const [sel, setSel] = useState(null);
      const [results, setResults] = useState([]);
      const [showExp, setShowExp] = useState(false);
      const [quizDone, setQuizDone] = useState(false);
      const [score, setScore] = useState(0);
      const [streak, setStreak] = useState(0);
      const [maxStreak, setMaxStreak] = useState(0);
      const [anim, setAnim] = useState(null);

      function startQuiz(key) {
        const qs = key === "all" ? shuffle(ALL_Q) : shuffle(QUIZ[key].questions.map(q => ({ ...q, cat: key, catLabel: QUIZ[key].label, catColor: QUIZ[key].color })));
        setQuestions(qs); setMode(key); setCur(0); setSel(null);
        setResults([]); setShowExp(false); setQuizDone(false);
        setScore(0); setStreak(0); setMaxStreak(0); setAnim(null);
        setScreen("quiz");
      }

      function choose(i) {
        if (sel !== null) return;
        setSel(i);
        const ok = i === questions[cur].ans;
        const ns = ok ? score + 1 : score;
        const nstr = ok ? streak + 1 : 0;
        setScore(ns); setStreak(nstr); setMaxStreak(m => Math.max(m, nstr));
        setResults(r => [...r, { q: questions[cur], sel: i, correct: ok }]);
        setShowExp(true);
        setAnim(ok ? "ok" : "no");
        setTimeout(() => setAnim(null), 900);
      }

      function next() {
        if (cur < questions.length - 1) { setCur(c => c + 1); setSel(null); setShowExp(false); }
        else setQuizDone(true);
      }

      const q = questions[cur];
      const pct = questions.length > 0 ? Math.round((score / questions.length) * 100) : 0;
      const catColor = q?.catColor || "#e63946";

      if (screen === "home") return (
        <div style={{ minHeight: "100vh", background: "linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)", padding: 20 }}>
          <div style={{ maxWidth: 660, margin: "0 auto" }}>
            <div style={{ textAlign: "center", padding: "36px 0 28px" }}>
              <div style={{ fontSize: 64 }}>🔥</div>
              <h1 style={{ color: "#fff", fontSize: 28, fontWeight: 800, margin: "8px 0 4px" }}>Quiz Antincendio VVF</h1>
              <p style={{ color: "#a0b4c8", fontSize: 14, margin: 0 }}>Idoneità Tecnica — Banco Ufficiale D.M. 2/9/2021</p>
              <div style={{ display: "flex", gap: 8, justifyContent: "center", marginTop: 14, flexWrap: "wrap" }}>
                {[`📚 ${ALL_Q.length} domande totali`, "✅ Spiegazioni dettagliate per ogni risposta", "🎯 Quiz per argomento"].map(t => (
                  <span key={t} style={{ background: "rgba(255,255,255,0.1)", color: "#e0e8f0", padding: "4px 12px", borderRadius: 20, fontSize: 11, fontWeight: 500 }}>{t}</span>
                ))}
              </div>
            </div>
            <button onClick={() => startQuiz("all")} style={{ width: "100%", background: "linear-gradient(135deg,#e63946,#c1121f)", border: "none", borderRadius: 18, padding: "22px 20px", marginBottom: 16, cursor: "pointer", textAlign: "left", boxShadow: "0 8px 32px rgba(230,57,70,0.4)" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                <span style={{ fontSize: 42 }}>🏆</span>
                <div>
                  <div style={{ color: "#fff", fontSize: 20, fontWeight: 800 }}>Quiz Generale Completo</div>
                  <div style={{ color: "#ffcdd2", fontSize: 13, marginTop: 2 }}>{ALL_Q.length} domande · Tutti gli argomenti mescolati</div>
                </div>
              </div>
            </button>
            <div style={{ color: "#a0b4c8", fontSize: 12, fontWeight: 600, textTransform: "uppercase", letterSpacing: 1, marginBottom: 10 }}>Quiz per argomento</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {Object.entries(QUIZ).map(([key, data]) => (
                <button key={key} onClick={() => startQuiz(key)} style={{ background: "rgba(255,255,255,0.06)", border: `1.5px solid ${data.color}44`, borderRadius: 14, padding: "16px 20px", cursor: "pointer", textAlign: "left" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                    <div style={{ width: 48, height: 48, borderRadius: 12, background: data.color + "33", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24, flexShrink: 0 }}>{data.label.split(" ")[0]}</div>
                    <div style={{ flex: 1 }}>
                      <div style={{ color: "#fff", fontSize: 16, fontWeight: 700 }}>{data.label.slice(data.label.indexOf(" ") + 1)}</div>
                      <div style={{ color: "#a0b4c8", fontSize: 12, marginTop: 2 }}>{data.questions.length} domande ufficiali VVF</div>
                    </div>
                    <div style={{ color: data.color, fontSize: 20 }}>›</div>
                  </div>
                </button>
              ))}
            </div>
            <div style={{ textAlign: "center", color: "#445566", fontSize: 11, marginTop: 20 }}>Domande tratte dal banco ufficiale per l'idoneità tecnica VVF · D.M. 2/9/2021</div>
          </div>
        </div>
      );

      if (quizDone) {
        const wrongQs = results.filter(r => !r.correct);
        const m = pct >= 80 ? { emoji: "🏆", msg: "Eccellente! Pronto per l'esame!" } : pct >= 60 ? { emoji: "💪", msg: "Bravo! Ripassia i punti mancanti." } : { emoji: "📚", msg: "Rileggi il materiale e riprova!" };
        return (
          <div style={{ minHeight: "100vh", background: "linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)", padding: 20 }}>
            <div style={{ maxWidth: 660, margin: "0 auto" }}>
              <div style={{ textAlign: "center", padding: "32px 20px 24px", background: "rgba(255,255,255,0.05)", borderRadius: 20, marginBottom: 20, border: "1.5px solid rgba(255,255,255,0.1)" }}>
                <div style={{ fontSize: 72, marginBottom: 8 }}>{m.emoji}</div>
                <div style={{ color: "#fff", fontSize: 24, fontWeight: 800, marginBottom: 6 }}>{m.msg}</div>
                <div style={{ display: "flex", justifyContent: "center", gap: 16, flexWrap: "wrap", marginTop: 16 }}>
                  {[{ v: `${score}/${questions.length}`, l: "Corrette", c: "#4caf50" }, { v: `${pct}%`, l: "Punteggio", c: pct >= 70 ? "#4caf50" : pct >= 50 ? "#ff9800" : "#e63946" }, { v: maxStreak, l: "Serie max 🔥", c: "#2196f3" }].map(s => (
                    <div key={s.l} style={{ background: "rgba(255,255,255,0.08)", borderRadius: 14, padding: "14px 20px", textAlign: "center" }}>
                      <div style={{ color: s.c, fontSize: 26, fontWeight: 900 }}>{s.v}</div>
                      <div style={{ color: "#a0b4c8", fontSize: 11, marginTop: 2 }}>{s.l}</div>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{ display: "flex", gap: 10, marginBottom: 20 }}>
                <button onClick={() => startQuiz(mode)} style={{ flex: 1, padding: "14px", borderRadius: 12, border: "none", background: "linear-gradient(135deg,#2196f3,#0d47a1)", color: "#fff", fontWeight: 700, fontSize: 15, cursor: "pointer" }}>🔄 Riprova</button>
                <button onClick={() => setScreen("home")} style={{ flex: 1, padding: "14px", borderRadius: 12, border: "1.5px solid rgba(255,255,255,0.2)", background: "transparent", color: "#fff", fontWeight: 700, fontSize: 15, cursor: "pointer" }}>🏠 Home</button>
              </div>
              {wrongQs.length > 0 && (
                <div>
                  <div style={{ color: "#e63946", fontSize: 14, fontWeight: 700, marginBottom: 10 }}>❌ Domande sbagliate — ripassa questi concetti:</div>
                  {wrongQs.map((r, i) => (
                    <div key={i} style={{ background: "rgba(230,57,70,0.1)", border: "1.5px solid rgba(230,57,70,0.3)", borderRadius: 12, padding: "14px", marginBottom: 8 }}>
                      <div style={{ color: "#ffcdd2", fontSize: 13, fontWeight: 600, marginBottom: 6 }}>{r.q.q}</div>
                      <div style={{ color: "#4caf50", fontSize: 12, marginBottom: 4 }}>✅ Risposta corretta: {r.q.opts[r.q.ans]}</div>
                      <div style={{ color: "#a0b4c8", fontSize: 11, lineHeight: 1.6 }}>{r.q.exps[r.q.ans]}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      }

      return (
        <div style={{ minHeight: "100vh", background: "linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)", padding: "16px 16px 40px" }}>
          <div style={{ maxWidth: 660, margin: "0 auto" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
