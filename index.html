              <button onClick={() => setScreen("home")} style={{ background: "rgba(255,255,255,0.1)", border: "none", color: "#fff", borderRadius: 10, padding: "8px 12px", cursor: "pointer", fontSize: 14 }}>← Home</button>
              <div style={{ flex: 1 }}>
                <div style={{ height: 6, background: "rgba(255,255,255,0.1)", borderRadius: 99, overflow: "hidden" }}>
                  <div style={{ height: "100%", width: (cur / questions.length * 100) + "%", background: `linear-gradient(90deg,${catColor},${catColor}aa)`, borderRadius: 99, transition: "width 0.4s" }} />
                </div>
                <div style={{ color: "#a0b4c8", fontSize: 11, marginTop: 3 }}>{cur + 1} di {questions.length}</div>
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                <span style={{ background: "#4caf5022", color: "#4caf50", border: "1px solid #4caf5044", borderRadius: 8, padding: "4px 10px", fontSize: 12, fontWeight: 700 }}>✅ {score}</span>
                {streak > 1 && <span style={{ background: "#ff980022", color: "#ff9800", border: "1px solid #ff980044", borderRadius: 8, padding: "4px 10px", fontSize: 12, fontWeight: 700 }}>🔥 {streak}</span>}
              </div>
            </div>
            <div style={{ marginBottom: 12 }}>
              <span style={{ background: catColor + "33", color: catColor, border: `1px solid ${catColor}55`, borderRadius: 20, padding: "4px 12px", fontSize: 12, fontWeight: 600 }}>{q.catLabel || mode}</span>
            </div>
            <div style={{ background: "rgba(255,255,255,0.07)", borderRadius: 18, padding: "22px 20px", marginBottom: 14, border: `1.5px solid ${catColor}33` }}>
              <div style={{ color: "#fff", fontSize: 16, fontWeight: 600, lineHeight: 1.6 }}>{q.q}</div>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 14 }}>
              {q.opts.map((opt, i) => {
                const isCorrect = i === q.ans, isSelected = i === sel;
                let bg = "rgba(255,255,255,0.06)", border = "1.5px solid rgba(255,255,255,0.12)", color = "#e0e8f0", icon = null;
                if (sel !== null) {
                  if (isCorrect) { bg = "rgba(76,175,80,0.2)"; border = "2px solid #4caf50"; color = "#a5d6a7"; icon = "✅"; }
                  else if (isSelected) { bg = "rgba(230,57,70,0.2)"; border = "2px solid #e63946"; color = "#ef9a9a"; icon = "❌"; }
                }
                return (
                  <button key={i} onClick={() => choose(i)} style={{ background: bg, border, borderRadius: 14, padding: "14px 16px", textAlign: "left", cursor: sel !== null ? "default" : "pointer", color, fontSize: 14, fontWeight: isCorrect && sel !== null ? 700 : 500, display: "flex", alignItems: "flex-start", gap: 10, transition: "all 0.2s" }}>
                    <span style={{ minWidth: 26, height: 26, borderRadius: 8, background: sel !== null ? "transparent" : "rgba(255,255,255,0.1)", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 13, color: sel !== null ? color : "#a0b4c8", flexShrink: 0 }}>
                      {sel !== null ? (icon || String.fromCharCode(65 + i)) : String.fromCharCode(65 + i)}
                    </span>
                    <span style={{ lineHeight: 1.5 }}>{opt}</span>
                  </button>
                );
              })}
            </div>
            {anim === "ok" && (
              <div style={{ textAlign: "center", fontSize: 32, marginBottom: 8 }}>
                {rand(["🎉","⭐","🔥","💪","🏆","✅","🚀","🎯"])}
                {streak > 2 && <span style={{ fontSize: 13, color: "#ff9800", fontWeight: 700, marginLeft: 8 }}>Serie di {streak}! 🔥</span>}
              </div>
            )}
            {showExp && (
              <div style={{ background: sel === q.ans ? "rgba(76,175,80,0.12)" : "rgba(230,57,70,0.12)", border: `2px solid ${sel === q.ans ? "#4caf50" : "#e63946"}55`, borderRadius: 16, padding: "16px 18px", marginBottom: 14 }}>
                <div style={{ color: sel === q.ans ? "#4caf50" : "#e63946", fontWeight: 700, fontSize: 15, marginBottom: 8 }}>
                  {sel === q.ans ? rand(MOTIV_OK) : rand(MOTIV_NO)}
                </div>
                <div style={{ color: "#c8d8e8", fontSize: 13, lineHeight: 1.75, marginBottom: sel !== q.ans ? 12 : 0 }}>{q.exps[sel]}</div>
                {sel !== q.ans && (
                  <div style={{ borderTop: "1px solid rgba(76,175,80,0.2)", paddingTop: 10 }}>
                    <div style={{ color: "#4caf50", fontWeight: 600, fontSize: 13, marginBottom: 4 }}>💡 Risposta corretta: "{q.opts[q.ans]}"</div>
                    <div style={{ color: "#a5d6a7", fontSize: 13, lineHeight: 1.75 }}>{q.exps[q.ans]}</div>
                  </div>
                )}
              </div>
            )}
            {sel !== null && (
              <button onClick={next} style={{ width: "100%", padding: "15px", borderRadius: 14, border: "none", background: `linear-gradient(135deg,${catColor},${catColor}bb)`, color: "#fff", fontWeight: 800, fontSize: 16, cursor: "pointer" }}>
                {cur < questions.length - 1 ? "Prossima domanda →" : "Vedi risultati 🏁"}
              </button>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
